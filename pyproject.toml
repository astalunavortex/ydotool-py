[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ydotool"
version = "0.1.0"
description = "Python wrapper for ydotool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{ name = "astalunavortex", email = "astalunavortex@gmail.com" }
]
keywords = ["ydotool", "wayland", "uinput", "automation"]
classifiers = [
	"Development Status :: 4 - Beta",
	"License :: OSI Approved :: MIT License",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/astalunavortex/ydotool-py"
Repository = "https://github.com/astalunavortex/ydotool-py"
Issues = "https://github.com/astalunavortex/ydotool-py/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
